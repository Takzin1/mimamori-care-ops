<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>見守りくん | Personalized Care</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><main><header><p class="eyebrow">MIMAMORI / PERSONALIZED CARE OPERATIONS</p><h1>見守った。その後は？</h1><p>業務は標準化する。優しさは画一化しない。</p><p class="notice">架空データ限定・ローカル試作版。医療判断や緊急連絡には使えません。</p></header>
<section id="login"><h2>職員ログイン（デモ）</h2><label for="token">端末に表示されたセッショントークン</label><input id="token" type="password" autocomplete="off"><button id="connect">接続</button></section>
<section id="work" hidden><div class="bar"><h2>入居者対応</h2><button id="logout" class="quiet">ログアウト</button></div><label for="search">入居者検索</label><input id="search" type="search" placeholder="氏名・居室"><label for="resident">入居者</label><select id="resident"></select><label for="category">対応内容</label><select id="category"><option value="greeting">朝の声かけ</option><option value="request">入居者からの依頼</option><option value="equipment">設備の相談</option><option value="handover">申し送り</option><option value="checkin">安否確認</option><option value="irregular">イレギュラー</option><option value="emergency">施設指定の緊急時手順</option></select><details id="choice"><summary>本人の現在の希望が登録内容と違う場合</summary><label for="choice-category">希望の項目</label><select id="choice-category"><option value="">未選択</option><option value="wake_time">起床時間</option><option value="conversation">会話</option><option value="independence">自立支援</option><option value="environment">環境</option><option value="visit_contact">訪室前の連絡</option><option value="communication">説明方法</option></select><label for="choice-value">本人が今伝えた希望（架空情報のみ）</label><input id="choice-value" maxlength="500"></details><button id="guide">対応ガイドを見る</button>
<article id="output" hidden><h2>対応ガイド</h2><p id="gate" role="status"></p><p id="version"></p><h3>施設共通の手順</h3><ol id="steps"></ol><h3>本人の確認済みの希望</h3><ul id="wishes"></ul><h3>職員の観察・個別の制約</h3><ul id="facts"></ul><h3>確認事項・責任者への相談</h3><ul id="questions"></ul><h3>禁止事項・根拠</h3><ul id="evidence"></ul><h3>確認チェック</h3><div id="checks"></div><label><input type="checkbox" id="human"> 本人の現在の希望を確認した／責任者への相談が必要と判断した</label><label for="summary">必要なときだけ対応を記録する（架空情報のみ）</label><textarea id="summary" maxlength="1000" rows="3"></textarea><label><input type="checkbox" id="follow"> 継続対応・申し送りが必要</label><button id="record">記録する</button><button id="promote" class="quiet" hidden>Caseへ昇格（通常優先度・人が確認）</button><p id="result" role="status"></p></article>
<article id="followup-panel"><div class="bar"><h2>申し送り・継続対応</h2><button id="refresh-followups" class="quiet">更新</button></div><p id="storage-mode"></p><p id="queue-status" role="status"></p><div id="followup-items"></div></article></section><p id="message" role="alert" aria-live="polite"></p></main></body></html>
